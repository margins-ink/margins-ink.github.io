<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <style>
    text { font-family: ui-monospace, monospace; font-size: 12px; fill: #374151; }
    .header { font-weight: 600; fill: #111827; }
    .label { font-size: 14px; font-weight: 600; fill: #111827; }
    .small { font-size: 10px; fill: #6B7280; }
  </style>

  <!-- Title -->
  <text x="200" y="24" text-anchor="middle" class="label">ECS Archetype: Column-Oriented</text>

  <!-- Archetype label -->
  <text x="40" y="52" class="small">Archetype: (Position, Velocity)</text>

  <!-- Entity IDs column -->
  <rect x="40" y="64" width="60" height="28" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="70" y="82" text-anchor="middle" class="header">Entity</text>
  <rect x="40" y="92" width="60" height="24" rx="2" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  <text x="70" y="108" text-anchor="middle">1</text>
  <rect x="40" y="116" width="60" height="24" rx="2" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  <text x="70" y="132" text-anchor="middle">2</text>
  <rect x="40" y="140" width="60" height="24" rx="2" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  <text x="70" y="156" text-anchor="middle">3</text>

  <!-- Position column - highlighted -->
  <rect x="120" y="64" width="100" height="28" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="170" y="82" text-anchor="middle" class="header">Position[]</text>
  <rect x="120" y="92" width="100" height="72" rx="2" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5"/>
  <text x="170" y="112" text-anchor="middle">(10.5, 20.3)</text>
  <text x="170" y="132" text-anchor="middle">(15.0, 8.7)</text>
  <text x="170" y="152" text-anchor="middle">(3.2, 44.1)</text>

  <!-- Velocity column - highlighted -->
  <rect x="240" y="64" width="100" height="28" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="290" y="82" text-anchor="middle" class="header">Velocity[]</text>
  <rect x="240" y="92" width="100" height="72" rx="2" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5"/>
  <text x="290" y="112" text-anchor="middle">(1.2, 0.0)</text>
  <text x="290" y="132" text-anchor="middle">(0.5, 1.0)</text>
  <text x="290" y="152" text-anchor="middle">(2.0, 0.3)</text>

  <!-- Arrow showing columnar storage -->
  <path d="M 170 170 L 170 190" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 290 170 L 290 190" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Memory layout hint -->
  <text x="170" y="205" text-anchor="middle" class="small">contiguous</text>
  <text x="290" y="205" text-anchor="middle" class="small">contiguous</text>

  <!-- Different archetype -->
  <text x="40" y="235" class="small">Archetype: (Position, Health)</text>
  <rect x="40" y="247" width="60" height="24" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="70" y="263" text-anchor="middle" class="header">Entity</text>
  <rect x="120" y="247" width="100" height="24" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="170" y="263" text-anchor="middle" class="header">Position[]</text>
  <rect x="240" y="247" width="80" height="24" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="280" y="263" text-anchor="middle" class="header">Health[]</text>
</svg>
