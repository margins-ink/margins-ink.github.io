<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" fill="none">
  <style>
    text { font-family: ui-monospace, monospace; font-size: 11px; fill: #374151; }
    .header { font-weight: 600; fill: #111827; font-size: 12px; }
    .label { font-size: 14px; font-weight: 600; fill: #111827; }
    .small { font-size: 9px; fill: #6B7280; }
    .success { fill: #059669; }
  </style>

  <!-- Title -->
  <text x="250" y="20" text-anchor="middle" class="label">CRDT: Operations Compose</text>

  <!-- Timeline -->
  <line x1="40" y1="55" x2="460" y2="55" stroke="#9CA3AF" stroke-width="2"/>
  <text x="40" y="45" class="small">tick start</text>
  <text x="420" y="45" class="small">tick end</text>

  <!-- Initial state -->
  <rect x="50" y="65" width="80" height="30" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
  <text x="90" y="84" text-anchor="middle" class="header">Health: 100</text>

  <!-- System A operation -->
  <line x1="160" y1="55" x2="160" y2="105" stroke="#6B7280" stroke-width="1" stroke-dasharray="4"/>
  <rect x="120" y="105" width="80" height="35" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="160" y="120" text-anchor="middle" class="small">System A</text>
  <text x="160" y="133" text-anchor="middle" class="header">Sub(10)</text>

  <!-- System B operation -->
  <line x1="280" y1="55" x2="280" y2="105" stroke="#6B7280" stroke-width="1" stroke-dasharray="4"/>
  <rect x="240" y="105" width="80" height="35" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="280" y="120" text-anchor="middle" class="small">System B</text>
  <text x="280" y="133" text-anchor="middle" class="header">Sub(20)</text>

  <!-- Merge -->
  <path d="M 200 130 Q 250 160 300 130" stroke="#6B7280" stroke-width="1" fill="none" stroke-dasharray="4"/>
  <text x="250" y="165" text-anchor="middle" class="small">compose: Sub(10) + Sub(20) = Sub(30)</text>

  <!-- Final state -->
  <line x1="420" y1="55" x2="420" y2="65" stroke="#6B7280" stroke-width="1"/>
  <rect x="380" y="65" width="80" height="30" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="420" y="84" text-anchor="middle" class="header success">Health: 70</text>

  <!-- Order note -->
  <text x="420" y="110" text-anchor="middle" class="small">order-independent</text>
</svg>
