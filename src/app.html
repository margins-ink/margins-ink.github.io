<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<style>
			#gpu-error {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				padding: 2rem;
				text-align: center;
				font: 1rem/1.4 system-ui, sans-serif;
				color: CanvasText;
				background: Canvas;
			}
		</style>
		<script>
			// The page is the WebGPU render and nothing else. This is the only DOM text: an error state, not a fallback article.
			window.__gpuError = function () {
				if (document.getElementById('gpu-error')) return;
				var d = document.createElement('div');
				d.id = 'gpu-error';
				d.textContent = 'This site is drawn with WebGPU. Your browser can not run it yet.';
				document.body.appendChild(d);
			};
			if (!navigator.gpu) document.addEventListener('DOMContentLoaded', window.__gpuError);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript><div id="gpu-error">This site is drawn with WebGPU. Your browser can not run it yet.</div></noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
