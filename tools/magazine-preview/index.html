<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>magazine preview</title>
	<style>
		:root { color-scheme: light dark; --bg: #c7c7cc; --fg: #111; }
		@media (prefers-color-scheme: dark) { :root { --bg: #0a0a0c; --fg: #eee; } }
		html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
		canvas { position: fixed; inset: 0; }
		#overlay { pointer-events: none; }
		#hud { position: fixed; left: 8px; bottom: 6px; font: 11px ui-monospace, monospace; color: var(--fg); background: color-mix(in srgb, var(--bg) 75%, transparent); padding: 2px 6px; border-radius: 3px; }
	</style>
</head>
<body>
	<canvas id="gpu"></canvas>
	<canvas id="overlay"></canvas>
	<div id="hud">starting</div>
	<script type="module" src="./main.ts"></script>
</body>
</html>
